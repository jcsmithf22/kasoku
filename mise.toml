[tools]
ruby = "3.3.0"
node = "18.17.0"
yarn = "1.22.19"
"gem:bundler" = "2.5.6"

[tasks.dependencies]
description = "Install locked Ruby and JavaScript dependencies"
run = [
  "bundle check || bundle install --jobs \"$(nproc)\" --retry 3",
  "yarn install --frozen-lockfile",
]

[tasks.database]
description = "Prepare development and test databases"
run = [
  "bin/rails db:prepare",
  "RAILS_ENV=test bin/rails db:prepare",
]
